
# EMBEDDED SERVER CONFIGURATION (ServerProperties)
server.port=9308
server.servlet.contextPath=/api-sidep-grupo-matricula

#DATASOURCE
api.sidep.datasource.driver-class-name=org.postgresql.Driver
api.sidep.datasource.url=jdbc:postgresql://192.168.32.40:5432/sidep
api.sidep.datasource.username=adm_sidep_prod
api.sidep.datasource.password=adm_sidep_prod


# properties usadas por la app en su logica interna
cl.mineduc.debug.ips=127.0.0.1

# LOGGING
logging.level.root = WARN
logging.level.cl.mineduc.sidep.datosgrupomatriculaapi = DEGUB
logging.level.com.zaxxer.hikari = INFO
logging.level.com.ibatis.common = INFO
logging.level.java.sql = INFO

# API PERSONA REGISTRO CIVIL (Ejemplo de configuraci�n de API externa)
url.endpoint.obtenerPersona=http://webdockerdesa.mineduc.cl/api-persona/v1/personas

# Configuraci�n de MyBatis
mybatis.mapper-locations=classpath:cl/mineduc/sidep/datosgrupomatriculaapi/mappers/*.xml
mybatis.type-aliases-package=cl.mineduc.sidep.datosgrupomatriculaapi.model
mybatis.config-location=classpath:mybatis-config.xml
